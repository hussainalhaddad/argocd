apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: nc-db-password
        ports:
        - containerPort: 5432
          name: postgres
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - mountPath: /var/lib/postgresql/data # Added /data for better persistence
          name: nc-db-data
      volumes:
      - name: nc-db-data
        persistentVolumeClaim:
          claimName: nc-db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nc-db-data
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: default
  volumeMode: Filesystem
