apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
---
apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: postgres
    namespace: nextcloud
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    strategy:
      type: Recreate
    template:
      metadata:
        namespace: nextcloud
      spec:
        containers:
        - envFrom:
          - secretRef:
              name: nc-db-password
              optional: false
          image: postgres:16-alpine
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 5432
            timeoutSeconds: 10
          name: postgres
          ports:
          - containerPort: 5432
            name: 5432tcp
            protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /var/lib/postgresql
            name: nc-db-data
        dnsPolicy: ClusterFirst
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - name: nc-db-data
          persistentVolumeClaim:
            claimName: nc-db-data
---
apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: nc-db-data
    namespace: nextcloud
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
    storageClassName: default
    volumeMode: Filesystem
    volumeName: nc-db-data
  status:
    accessModes:
    - ReadWriteOnce
    capacity:
      storage: 2Gi
    phase: Bound
